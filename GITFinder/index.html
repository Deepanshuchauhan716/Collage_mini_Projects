<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>

    <body>

        <!-- create nav bar -->
        <nav class="nav-container">
            <div class="nav-logo">
                <i class="fa-brands fa-github" style="margin-right: 10px;"></i> GitHub <span class="find">Finder</span>
            </div>

            <div class="nav-link">
                <a href="#home" class="nav-item active" id="nav-home">
                    <i class="fa-solid fa-house" style="margin-right: 10px;"></i>
                    <span>Home</span>
                </a>
                <a href="#github" class="nav-item" id="nav-github">
                    <i class="fa-brands fa-github" style="margin-right: 10px;"></i>
                    <span>GitHub</span>
                </a>
                <a href="#about" class="nav-item" id="nav-about">
                    <i class="fa-solid fa-circle-info" style="margin-right: 10px;"></i>
                    <span>About</span>
                </a>
            </div>
        </nav>

        <!-- hero section -->
        <div class="user-text">
            <h1 class="user">Find any <span id="git">Git hub </span>User</h1>
        </div>
        <div class="user-text2">
            <p class="long-text">Enter a user name to get their git hub details instantly</p>
        </div>

        <div class="search-container">
            <div class="input-group">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" class="search-input" placeholder="">
                <button class="search-btn">
                    <i class="fa-solid fa-rocket"></i> <span>Search</span>
                </button>
            </div>
        </div>

        <div class="profile-card">
            <div class="profile-head">
                <div class="avtar-container">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0HlXm6uGZBDJV475_P2yO6hMEXhIzNOpcJXodeCP6rn5jciQfHz0sgX4&s=10"
                        alt="Profile-pic" class="avtar">
                </div>
                <div class="user-info">
                    <div class="name">
                        <h1>Deepanshu chauhan</h1>
                        <i class="fa-solid fa-circle-check verified-icon"></i>
                    </div>
                    <p class="username">@deepanshuchauhan716</p>
                    <p class="bio">💻 Code • Learn • Build • Grow 🚀</p>
                    <div class="location">
                        <span><i class="fa-solid fa-location-dot"></i> India</span>
                        <span>|</span>
                        <span class="git-link"><i class="fa-solid fa-link"></i>github.com/Deepanshuchauhan716</span>
                    </div>
                </div>
                <div class="action-btn">
                    <button class="follow-btn"><i class="fa-solid fa-user-plus"></i>Follow</button>
                </div>


                <!-- middle section -->
                <div class="middle-section">
                    <div class="count-div">
                        <i class="fa-solid fa-book repo-icon"></i>
                        <div class="count-text">
                            <h1>87</h1>
                            <p>Repositories</p>
                        </div>
                    </div>
                    <div class="count-div">
                        <i class="fa-solid fa-users follower-icon"></i>
                        <div class="count-text">
                            <h1>12</h1>
                            <p>Follower</p>
                        </div>
                    </div>
                    <div class="count-div">
                        <i class="fa-solid fa-user-plus following-icon"></i>
                        <div class="count-text">
                            <h1>2</h1>
                            <p>Following</p>
                        </div>
                    </div>
                    <div class="count-div">
                        <i class="fa-solid fa-star star-icon"></i>
                        <div class="count-text">
                            <h1>1.2k</h1>
                            <p>Star</p>
                        </div>
                    </div>
                </div>

                <!-- middle sectio end -->
            </div>


        </div>
        </div>
    </body>

</html>
