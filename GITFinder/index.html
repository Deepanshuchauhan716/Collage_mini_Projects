<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>

    <body>

        <!-- create nav bar -->
        <nav class="nav-container">
            <div class="nav-logo">
                <i class="fa-brands fa-github" style="margin-right: 10px;"></i> GitHub <span class="find">Finder</span>
            </div>

            <div class="nav-link">
                <a href="#home" class="nav-item active" id="nav-home">
                    <i class="fa-solid fa-house" style="margin-right: 10px;"></i>
                    <span>Home</span>
                </a>
                <!-- <a href="#github" class="nav-item" id="nav-github">
                    <i class="fa-brands fa-github" style="margin-right: 10px;"></i>
                    <span>GitHub</span>
                </a> -->
                <a href="about.html" class="nav-item" id="nav-about">
                    <i class="fa-solid fa-circle-info" style="margin-right: 10px;"></i>
                    <span>About</span>
                </a>
            </div>
        </nav>

        <!-- hero section -->
        <div class="user-text">
            <h1 class="user">Find any <span id="git">Git hub </span>User</h1>
        </div>
        <div class="user-text2">
            <p class="long-text">Enter a user name to get their git hub details instantly</p>
        </div>

        <div class="search-container">
            <div class="input-group">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" class="search-input" placeholder="Enter username" id="first-inp">
                <button class="search-btn" id="searchbtn">
                    <i class="fa-solid fa-rocket"></i> <span>Search</span>
                </button>
            </div>
        </div>

        <div class="profile-card" id="result" style="display: none;">
            <div class="profile-head">
                <div class="avtar-container">
                    <!-- user ki photo -->
                    <img src="" alt="Profile-pic" class="avtar" id="user-avatar">
                </div>
                <div class="user-info">
                    <div class="name">
                        <!-- user ka naam -->
                        <h1 id="user-name"></h1>
                        <i class="fa-solid fa-circle-check verified-icon"></i>
                    </div>
                    <!-- username user ka  -->
                    <p class="username" id="user-login"></p>
                    <!-- user ka bio -->
                    <p class="bio" id="user-bio"></p>
                    <div class="location">
                        <!-- user ki location -->
                        <span id="user-location"><i class="fa-solid fa-location-dot"></i> India</span>
                        <span>|</span>
                        <!-- user ki link -->
                        <span class="git-link" id="user-link"><i class="fa-solid fa-link"></i></span>
                    </div>
                </div>
                <div class="action-btn">
                    <button class="follow-btn"><i class="fa-solid fa-user-plus"></i>Follow</button>
                </div>
            </div>

            <!-- middle section -->
            <div class="middle-section">
                <div class="count-div">
                    <i class="fa-solid fa-book repo-icon"></i>
                    <div class="count-text">
                        <!-- user reposetries -->
                        <h1 id="user-repos">0</h1>
                        <p>Repositories</p>
                    </div>
                </div>
                <div class="count-div">
                    <i class="fa-solid fa-users follower-icon"></i>
                    <div class="count-text">
                        <!-- user follower -->
                        <h1 id="user-followers">0</h1>
                        <p>Follower</p>
                    </div>
                </div>
                <div class="count-div">
                    <i class="fa-solid fa-user-plus following-icon"></i>
                    <div class="count-text">
                        <!-- user following -->
                        <h1 id="user-following">0</h1>
                        <p>Following</p>
                    </div>
                </div>
                <div class="count-div">
                    <i class="fa-solid fa-star star-icon"></i>
                    <div class="count-text">
                        <!-- user gist  -->
                        <h1 id="user-gists">0</h1>
                        <p>Gists</p>
                    </div>
                </div>
            </div>

            <!-- middle sectio end -->
            <div class="bottom-grid">
                <div class="repo-section">
                    <div class="repo-head">
                        <h3><i class="fa-regular fa-folder-open"></i> Popular Repositories</h3>
                        <a href="#" class="view-all">View all <i class="fa-solid fa-arrow-right"></i></a>
                    </div>

                    <div class="repo-list" id="repo-list-container">
                        <!-- <div class="repo-first">
                            <div class="repo-icon">
                                <i class="fa-solid fa-file-code"></i>
                                <div>
                                    <h4 id="user-repo-name"></h4>
                                </div>
                            </div>
                            <div class="repo-star"><i class="fa-solid fa-star"></i><span id="user-repo-stars">0</span> </div>
                        </div> -->
                    </div>
                </div>

                <!-- end repo -->
                <div class="about-section">
                    <h3>About</h3>
                    <p id="user-about-bio">No bio Available</p>
                    <div class="tags" id="user-tags">
                        <!-- dynamically -->
                </div>
            </div>

         </div>
        </div>


        <!-- toggle -->


        <div class="mobile-bottom">
            <div class="nav-menu" id="mobile-nav">
                <a href="#home" class="mob-item">
                    <i class="fa-solid fa-house"></i>
                </a>
                <!-- <a href="#github" class="mob-item">
                    <i class="fa-brands fa-github"></i>
                </a> -->
                <a href="about.html" class="mob-item">
                    <i class="fa-solid fa-circle-info"></i>
                </a>
            </div>
            <button class="fab-btn" id="ToggleBtn">
                <i class="fa-solid fa-plus" id="fabIcon"></i>
            </button>
        </div>
        <script src="script.js"></script>

        <script>
            const fabbtn = document.getElementById("ToggleBtn");
            const navmenu = document.getElementById("mobile-nav");

           fabbtn.addEventListener("click",() => {
            navmenu.classList.toggle('active')
            fabbtn.classList.toggle('active')
           })
        </script>
    </body>

</html>
