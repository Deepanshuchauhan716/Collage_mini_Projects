    <h1 class="dash">Issued Book</h1>
    <div class="card">
        <form action="">
            <label for="Student Name">Student Name</label><input type="text" class="StudentName" name="student_name">
            <label for="Enter Email">Enter Email</label><input type="email" class="Email" name="student_email">
            <label for="Roll Number">Roll Number</label><input type="number" class="RollNumber" name="roll_number">
            <label for="Book Name">Book Name</label><input type="text" class="BookName"  name="book_name">
            <label for="Issued Date">Issued Date</label><input type="date" class="IssuedDate" placeholder="Select date" name="issue_date">
            <label for="Return Date">Return Date</label><input type="date" class="ReturnDate" name="return_date">
            <button class="issu">Issued Book</button>
        </form>
    </div>
    
<div class="issue-popup" id="issuePopup">
  <div class="issue-card">

    <div class="issue-icon">
      <i class="fa-solid fa-circle-check"></i>
    </div>

    <h2>Book Issued Successfully!</h2>
    <p>Book has been issued to the student.</p>
    <p id="issueUniqueId" style="font-weight: bold; color: #4CAF50;"></p>

    <button id="closeIssue">OK</button>  
    <div id="qrBtnContainer"></div>

   <button id="closeIssueQRBtn" onclick="closeIssueQR()">Close</button>

  </div>
</div>
<div id="errorPopup" class="error-popup">
  <div class="error-card">
    <h2>❌ Book Not Available</h2>
    <p>This book is not available in library</p>
    <button id="closeError">OK</button>
  </div>
</div>
<div class="ini">
<img src="../img/Smart Library logo design.png" alt="" class="hlo">
 
</div>

</div>
