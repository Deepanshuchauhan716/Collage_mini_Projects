<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock">
        <!-- 1 to 12 number -->
         <div id="number" class="number1"><span>1</span></div>
         <div id="number" class="number2"><span>2</span></div>
         <div id="number" class="number3"><span>3</span></div>
         <div id="number" class="number4"><span>4</span></div>
         <div id="number" class="number5"><span>5</span></div>
         <div id="number" class="number6"><span>6</span></div>
         <div id="number" class="number7"><span>7</span></div>
         <div id="number" class="number8"><span>8</span></div>
         <div id="number" class="number9"><span>9</span></div>
         <div id="number" class="number10"><span>10</span></div>
         <div id="number" class="number11"><span>11</span></div>
         <div id="number" class="number12"><span>12</span></div>

         <div id="hour" class="hour hour-hand"></div>
         <div id="minute" class="hour minute-hand"></div>
         <div id="second" class=" hour second-hand"></div>

         <div class="center-dot"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
